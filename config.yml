version: 1
chain:
  name: ethwei
  binary: ethweid
  prefix: ete
validation: sovereign
default_denom: WEI
accounts:
- name: alice
  coins:
  - 4000000000000000WEI
- name: bob
  coins:
  - 2000000000000000WEI
- name: mike
  coins:
  - 500000000000000WEI
- name: andy
  coins:
  - 500000000000000WEI
client:
  openapi:
    path: docs/static/openapi.json
faucet:
  name: bob
  coins:
  - 1000000000WEI
validators:
- name: alice
  bonded: 1000000000000WEI
  app:
    minimum-gas-prices: "0.025WEI"
- name: mike
  bonded: 500000000000WEI
  app:
    minimum-gas-prices: "0.025WEI"
- name: andy
  bonded: 500000000000WEI
  app:
    minimum-gas-prices: "0.025WEI"
genesis:
  app_state:
    bank:
      denom_metadata:
        - base: WEI
          display: ETE
          name: Ethwei
          symbol: ETE
          denom_units:
            - denom: WEI
              exponent: 0
            - denom: ETE
              exponent: 6
    staking:
      params:
        bond_denom: WEI
        max_validators: 6
        unbonding_time: "86400s"
    slashing:
      params:
        # ~10000 blocks at 5s ≈ 13.9h window; must sign 50% → ~7h of grace
        # before jailing. The SDK default (100 blocks) gave only ~4 minutes,
        # so a routine reboot or slow upgrade would slash every delegator.
        signed_blocks_window: "10000"
        min_signed_per_window: "0.500000000000000000"
        downtime_jail_duration: "600s"
        # Downtime is an accident: 0.01% (SDK default 1% was far too harsh).
        slash_fraction_downtime: "0.000100000000000000"
        # Double-signing is an attack, not an accident: keep it painful at 5%.
        slash_fraction_double_sign: "0.050000000000000000"
    crisis:
      constant_fee:
        denom: WEI
        amount: "1000000000"
    distribution:
      params:
        community_tax: "0.000000000000000000"
    gov:
       params:
         min_deposit:
           - denom: WEI
             amount: "100000000"
         expedited_min_deposit:
           - denom: WEI
             amount: "200000000"
         voting_period: "86400s"
         expedited_voting_period: "3600s"
