version: 1
chain:
  name: ethwei
  binary: ethweid
  prefix: ete
validation: sovereign
default_denom: WEI
accounts:
- name: alice
  coins:
  - 4000000000000000WEI
- name: bob
  coins:
  - 2000000000000000WEI
- name: mike
  coins:
  - 500000000000000WEI
- name: andy
  coins:
  - 500000000000000WEI
client:
  openapi:
    path: docs/static/openapi.json
faucet:
  name: bob
  coins:
  - 1000000000WEI
validators:
- name: alice
  bonded: 1000000000000WEI
  app:
    minimum-gas-prices: "0.025WEI"
- name: mike
  bonded: 500000000000WEI
  app:
    minimum-gas-prices: "0.025WEI"
- name: andy
  bonded: 500000000000WEI
  app:
    minimum-gas-prices: "0.025WEI"
genesis:
  app_state:
    bank:
      denom_metadata:
        - base: WEI
          display: ETE
          name: Ethwei
          symbol: ETE
          denom_units:
            - denom: WEI
              exponent: 0
            - denom: ETE
              exponent: 6
    staking:
      params:
        bond_denom: WEI
        max_validators: 6
        unbonding_time: "86400s"
    slashing:
      params:
        # Cosmos Hub style: a 10000-block window (~13.9h at 5s) where only 5%
        # must be signed → a validator can miss up to 9500 blocks ≈ 13h before
        # being jailed. The SDK default (100 blocks / 50%) allowed only ~4
        # minutes, so a routine reboot or slow upgrade would slash every
        # delegator. Grace matters more than fast removal of dead validators.
        signed_blocks_window: "10000"
        min_signed_per_window: "0.050000000000000000"
        downtime_jail_duration: "600s"
        # Downtime is an accident: 0.01% (SDK default 1% was far too harsh).
        slash_fraction_downtime: "0.000100000000000000"
        # Double-signing is an attack, not an accident: keep it painful at 5%.
        slash_fraction_double_sign: "0.050000000000000000"
    crisis:
      constant_fee:
        denom: WEI
        amount: "1000000000"
    distribution:
      params:
        community_tax: "0.000000000000000000"
    gov:
       params:
         # 1,000,000 ETE — 0.1% of the 1B genesis supply. Default governance
         # means anyone may propose, so the deposit is the only spam gate.
         min_deposit:
           - denom: WEI
             amount: "1000000000000"
         # 2,000,000 ETE — a 2x premium to fast-track. (Cosmos Hub instead
         # keeps these near-equal and relies on the 66.7% expedited vote
         # threshold as the real gate; Ethwei chooses to charge for speed too.)
         expedited_min_deposit:
           - denom: WEI
             amount: "2000000000000"
         voting_period: "86400s"
         expedited_voting_period: "3600s"
